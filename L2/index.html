<!DOCTYPE html>
<head>
   
    <title>Basic Form with All Input Types</title>
</head>
<body>

    <h1>Basic Form with All Input Types</h1>

    <form action="#" method="post">

        <!-- Text Input -->
        <label for="text">Text Input:</label>
        <input type="text" id="text" name="text" placeholder="Enter text"><br><br>

        <!-- Password Input -->
        <label for="password">Password Input:</label>
        <input type="password" id="password" name="password" placeholder="Enter password"><br><br>

        <!-- Email Input -->
        <label for="email">Email Input:</label>
        <input type="email" id="email" name="email" placeholder="Enter email"><br><br>

        <!-- Number Input -->
        <label for="number">Number Input:</label>
        <input type="number" id="number" name="number" min="1" max="100" placeholder="Enter a number"><br><br>

        <!-- Date Input -->
        <label for="date">Date Input:</label>
        <input type="date" id="date" name="date"><br><br>

        <!-- Time Input -->
        <label for="time">Time Input:</label>
        <input type="time" id="time" name="time"><br><br>

        <!-- URL Input -->
        <label for="url">URL Input:</label>
        <input type="url" id="url" name="url" placeholder="Enter URL"><br><br>

        <!-- Tel Input -->
        <label for="tel">Telephone Input:</label>
        <input type="tel" id="tel" name="tel" placeholder="Enter phone number"><br><br>

        <!-- Color Input -->
        <label for="color">Color Input:</label>
        <input type="color" id="color" name="color"><br><br>

        <!-- Checkbox -->
        <label for="checkbox">Checkbox:</label>
        <input type="checkbox" id="checkbox" name="checkbox" value="Yes"><br><br>

        <!-- Radio Button -->
        <label for="radio">Radio Button:</label>
        <input type="radio" id="radio1" name="radio" value="Option 1"> Option 1
        <input type="radio" id="radio2" name="radio" value="Option 2"> Option 2<br><br>

        <!-- File Input -->
        <label for="file">File Input:</label>
        <input type="file" id="file" name="file"><br><br>

        <!-- Textarea -->
        <label for="textarea">Textarea:</label><br>
        <textarea id="textarea" name="textarea" rows="4" cols="50" placeholder="Enter text here"></textarea><br><br>

        <!-- Select Dropdown -->
        <label for="select">Select Input:</label>
        <select id="select" name="select">
            <option value="option1">Option 1</option>
            <option value="option2">Option 2</option>
            <option value="option3">Option 3</option>
        </select><br><br>

        <!-- Submit Button -->
        <input type="submit" value="Submit">

    </form>

</body>
</html>
